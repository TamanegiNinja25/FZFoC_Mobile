# Builds the Android APK and publishes it as a GitHub Release.
#
#   git tag v0.6.0 && git push origin v0.6.0   -> builds, creates release "v0.6.0" with FZFoC.apk
#   Actions tab -> "Release APK" -> Run workflow -> builds only (APK attached to the run, no release)
#
# The tag is the single source of truth for the version: it is written into
# project.godot (shown in the menu and used by the in-game update check) and the
# Android version code (major*10000 + minor*100 + patch, so updates install over
# older versions).
#
# Signing: set the repository secret DEBUG_KEYSTORE_BASE64 (a base64-encoded
# debug keystore, alias androiddebugkey, password android) so every release has
# the same signature and installs as an update. Without it a throwaway keystore
# is generated and players must uninstall before installing a new release.

name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  APK_NAME: FZFoC.apk

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q templates.tpz && mv templates/* "$dest/"

      - name: Prepare signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          ks="$RUNNER_TEMP/debug.keystore"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            # Pasted secrets often pick up line breaks or spaces: drop all whitespace first.
            if ! printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > "$ks" 2>/dev/null; then
              echo "::error::DEBUG_KEYSTORE_BASE64 is not valid base64 ($(printf '%s' "$DEBUG_KEYSTORE_BASE64" | wc -c) characters). Copy the keystore again and replace the secret."
              exit 1
            fi
            if ! keytool -list -keystore "$ks" -storepass android -alias androiddebugkey > /dev/null 2>&1; then
              echo "::error::DEBUG_KEYSTORE_BASE64 decodes ($(wc -c < "$ks") bytes) but isn't a keystore with alias androiddebugkey and password android."
              exit 1
            fi
            # The certificate fingerprint is public; it lets the owner confirm which key signed the release.
            echo "::notice::Signing with the shared key, SHA-256 $(keytool -list -v -keystore "$ks" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}')"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 is not set; signing with a throwaway key (players must uninstall before updating)."
            keytool -genkeypair -keystore "$ks" -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$ks"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres"

      - name: Stamp version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            IFS=. read -r major minor patch <<< "$version"
            code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
            sed -i "s/^config\/version=.*/config\/version=\"$version\"/" Prototype/project.godot
            sed -i "0,/^version\/code=.*/s//version\/code=$code/" Prototype/export_presets.cfg
            echo "Version $version (code $code)"
          fi
          grep -m1 '^config/version=' Prototype/project.godot

      - name: Export APK
        run: |
          mkdir -p Prototype/build
          ./godot --headless --path Prototype --import || true
          ./godot --headless --path Prototype --export-debug "Android" "build/$APK_NAME"
          test -s "Prototype/build/$APK_NAME" || { echo "::error::Export produced no APK"; exit 1; }
          ls -lh "Prototype/build/$APK_NAME"

      - name: Attach APK to the run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: Prototype/build/${{ env.APK_NAME }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Prototype/build/${{ env.APK_NAME }}
          generate_release_notes: true
          body: |
            **Install:** download `FZFoC.apk` below on your Android phone (arm64, Android 7+), open it and allow installs from this source.
            Already installed? The game's main menu shows an **Update available** button when a newer release is out.
